name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    # Las pruebas de integracion corren contra PostgreSQL real, igual que en local.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistix_pruebas
          POSTGRES_USER: logistix
          POSTGRES_PASSWORD: logistix_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U logistix -d logistix_pruebas"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas (dominio + integracion)
        env:
          LOGISTIX_TEST_DB_PASSWORD: logistix_ci
          TZ: America/Bogota
        run: ./mvnw -B test
