<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGISTI-X · Prototipo navegable</title>
<style>
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#111827; --ink2:#4B5563; --ink3:#6B7280;
  --line:#E5E7EB; --line2:#D1D5DB; --brand:#1D4ED8; --brand-2:#DBEAFE;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  /* colores de integración: los mismos del diagrama de clases */
  --sales:#2563EB; --sales-bg:#DBEAFE;
  --crm:#7C3AED; --crm-bg:#EDE9FE;
  --calc:#475569; --calc-bg:#F1F5F9;
  --evt:#C2410C; --evt-bg:#FFEDD5;
  --out:#BE185D; --out-bg:#FCE7F3;
  --r:8px; --r2:12px;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}

/* ------------------------------------------------ marco del prototipo */
.proto{display:grid;grid-template-columns:272px 1fr;height:100vh}
.side{background:#0F172A;color:#CBD5E1;overflow:auto;padding:20px 12px 24px}
.side h1{font-size:15px;color:#fff;margin:0 8px 2px;letter-spacing:.01em}
.side .sub{font-size:12px;color:#94A3B8;margin:0 8px 18px}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748B;margin:18px 8px 6px}
.side a{display:flex;gap:8px;align-items:baseline;padding:7px 8px;border-radius:6px;color:#CBD5E1;text-decoration:none;font-size:13px}
.side a .cu{font-family:var(--mono);font-size:11px;color:#64748B;min-width:52px}
.side a:hover{background:#1E293B}
.side a.on{background:#1D4ED8;color:#fff}
.side a.on .cu{color:#BFDBFE}

.main{display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.toolbar .ttl{font-weight:600;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
.stage{flex:1;overflow:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.notes{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.card dt{color:var(--ink3)} .card dd{margin:0}
.card code{font-family:var(--mono);font-size:12px;background:#F3F4F6;padding:1px 5px;border-radius:4px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend span{display:flex;gap:8px;align-items:center}
.pinlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13px}
.pinlist li{display:grid;grid-template-columns:22px 1fr;gap:8px}

/* ------------------------------------------------ la app (pantallas) */
.app{background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06)}
.appbar{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
.logo{font-weight:700;letter-spacing:-.01em}.logo b{color:var(--brand)}
.appbar nav{display:flex;gap:4px;margin-left:12px}
.appbar nav span{padding:6px 10px;border-radius:6px;color:var(--ink2);font-size:13px}
.appbar nav span.on{background:var(--brand-2);color:var(--brand);font-weight:600}
.appbar .user{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.appbody{padding:24px}
.crumbs{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.h{display:flex;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.h h2{margin:0;font-size:22px;letter-spacing:-.01em}
.h .act{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad);border-color:#FCA5A5}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.box{border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.box h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.f{display:flex;flex-direction:column;gap:6px;position:relative}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.f .in{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;background:#fff;min-height:38px;display:flex;align-items:center}
.f .in.ro{background:#F9FAFB;color:var(--ink2)}
.f .in.big{min-height:76px;align-items:flex-start}
.f .help{font-size:12px;color:var(--ink3)}
.f .err{font-size:12px;color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#F9FAFB}
table.t td.mono,table.t td:first-child{white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-REGISTRADO{background:#F3F4F6;color:#374151}.st-EN_PREPARACION{background:#E0E7FF;color:#3730A3}
.st-ASIGNADO{background:#DBEAFE;color:#1D4ED8}.st-EN_RUTA{background:#CFFAFE;color:#0E7490}
.st-ENTREGADO{background:var(--ok-bg);color:var(--ok)}.st-FALLIDO{background:var(--warn-bg);color:var(--warn)}
.st-DEVUELTO{background:#FAE8FF;color:#86198F}.st-CANCELADO{background:var(--bad-bg);color:var(--bad)}
.kpi{border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink3)}
.bar{height:8px;border-radius:99px;background:#F3F4F6;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.banner{display:block;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.banner.info{background:var(--brand-2);color:#1E3A8A}.banner.ok{background:var(--ok-bg);color:#14532D}
.banner.warn{background:var(--warn-bg);color:#78350F}.banner.bad{background:var(--bad-bg);color:#7F1D1D}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .in{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink2);background:#fff}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 18px 36px}
.tl li::before{content:"";position:absolute;left:5px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.tl li.nov::before{border-color:var(--warn)} .tl li.fin::before{border-color:var(--ok)}
.tl .when{font-size:12px;color:var(--ink3)}
.tl .what{font-weight:600}
.label-guia{border:2px dashed var(--ink);border-radius:10px;padding:18px;font-family:var(--mono);max-width:460px}
.barcode{height:56px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 11px,#fff 11px 12px);margin:10px 0}
.modal-back{background:rgba(17,24,39,.45);border-radius:14px;padding:40px 24px;display:flex;justify-content:center}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px}
.stepper{display:flex;gap:8px;margin-bottom:18px}
.stepper span{flex:1;font-size:12px;padding:8px 10px;border-radius:8px;background:#F3F4F6;color:var(--ink3);font-weight:600}
.stepper span.on{background:var(--brand-2);color:var(--brand)}
.stepper span.ok{background:var(--ok-bg);color:var(--ok)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0}
.check i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.check i.y{background:var(--ok-bg);color:var(--ok)} .check i.n{background:var(--bad-bg);color:var(--bad)} .check i.w{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--ink3)} .mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{height:16px}

/* ------------------------------------------------ marco móvil (app del transportador) */
.phone-wrap{display:flex;justify-content:center;padding:8px 0}
.phone{width:390px;border:10px solid #111827;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 20px 40px rgba(15,23,42,.18)}
.phone .pbar{display:flex;justify-content:space-between;padding:10px 20px 6px;font-size:12px;font-weight:600;background:#fff}
.phone .phead{padding:10px 18px 14px;border-bottom:1px solid var(--line)}
.phone .phead .t{font-size:18px;font-weight:700}
.phone .pbody{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;min-height:560px}
.phone .btn{justify-content:center;padding:12px 14px;font-size:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font-size:12.5px}
.chips span.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ------------------------------------------------ estados: carga, vacío, error */
.skel{background:linear-gradient(90deg,#F3F4F6 0%,#E5E7EB 50%,#F3F4F6 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty,.errbox{text-align:center;padding:56px 24px;border:1px dashed var(--line2);border-radius:var(--r2)}
.empty .ic,.errbox .ic{width:48px;height:48px;border-radius:12px;margin:0 auto 14px;display:grid;place-items:center;font-size:22px}
.empty .ic{background:#F3F4F6}.errbox .ic{background:var(--bad-bg);color:var(--bad)}
.empty h4,.errbox h4{margin:0 0 6px;font-size:16px}
.empty p,.errbox p{margin:0 auto 16px;max-width:440px;color:var(--ink2)}
.errbox .code{font-family:var(--mono);font-size:12px;color:var(--bad);margin-bottom:14px}

/* ------------------------------------------------ anotaciones de integración */
.attr,.tag{text-transform:none}
th .attr{letter-spacing:0} body.ann th .attr{display:block;margin-top:2px}
.tag{display:none;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.attr{display:none;font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:400}
.pin{display:none;width:20px;height:20px;border-radius:50%;background:#111827;color:#fff;font-size:11px;font-weight:700;place-items:center;flex:none}
body.ann .tag{display:inline-block} body.ann .attr{display:inline} body.ann .pin{display:inline-grid;vertical-align:middle;margin-right:4px}
body.ann [data-src]{outline:2px dashed var(--c);outline-offset:3px;border-radius:8px}
[data-src="SALES-X"]{--c:var(--sales)} [data-src="CRM-X"]{--c:var(--crm)} [data-src="CALC"]{--c:var(--calc)}
[data-src="EVT"]{--c:var(--evt)} [data-src="OUT"]{--c:var(--out)}
.tag.sales{background:var(--sales-bg);color:var(--sales)} .tag.crm{background:var(--crm-bg);color:var(--crm)}
.tag.calc{background:var(--calc-bg);color:var(--calc)} .tag.evt{background:var(--evt-bg);color:var(--evt)} .tag.out{background:var(--out-bg);color:var(--out)}
.sw{width:12px;height:12px;border-radius:3px;border:2px dashed}

/* ------------------------------------------------ JSON */
details.json{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.json summary{cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:600;background:#F9FAFB;list-style:none}
details.json summary::-webkit-details-marker{display:none}
details.json pre{margin:0;padding:12px;font-family:var(--mono);font-size:11.5px;background:#0F172A;color:#E2E8F0;overflow:auto;max-height:340px}
body.captura .notes{display:none} body.captura .stage{grid-template-columns:1fr}

@media (max-width:1100px){.stage{grid-template-columns:1fr}.notes{position:static}}
@media (max-width:760px){.proto{grid-template-columns:1fr}.side{display:none}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body class="ann">
<div class="proto">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="toolbar">
      <div class="ttl" id="ttl"></div>
      <label class="chk"><input type="checkbox" id="ann" checked> Mostrar puntos de integración y atributos</label>
      <div class="seg" id="estados">
        <button data-e="normal" class="on">Normal</button>
        <button data-e="carga">Cargando</button>
        <button data-e="vacio">Vacío</button>
        <button data-e="error">Error</button>
      </div>
    </div>
    <div class="stage">
      <div id="screen"></div>
      <div class="notes" id="notes"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   LOGISTI-X · Prototipo navegable de mockups
   Cada pantalla declara: casos de uso, RF, clases/atributos, endpoint y DTO,
   y sus estados (carga, vacío, error). Las anotaciones (tag/attr/pin) salen
   del mismo lugar que el diagrama de clases: un campo = un atributo.
   ========================================================================== */

// ---------- helpers de marcado
const T = {
  sales: '<span class="tag sales">← SALES-X</span>',
  crm:   '<span class="tag crm">← CRM-X</span>',
  calc:  '<span class="tag calc">calculado en servidor</span>',
  evt:   (d) => `<span class="tag evt">evento → ${d}</span>`,
  out:   '<span class="tag out">→ SERVI-X (REST)</span>',
};
const A = (a) => `<span class="attr">${a}</span>`;
const P = (n) => `<span class="pin">${n}</span>`;
const st = (e) => `<span class="pill st-${e}">${e.replace('_',' ')}</span>`;
function field(label, value, {attr='', tag='', src='', ro=false, big=false, help='', err='', pin=''} = {}) {
  return `<div class="f"${src ? ` data-src="${src}"` : ''}>
    <label>${pin ? P(pin) : ''}${label} ${tag} ${A(attr)}</label>
    <div class="in${ro ? ' ro' : ''}${big ? ' big' : ''}">${value}</div>
    ${help ? `<div class="help">${help}</div>` : ''}${err ? `<div class="err">${err}</div>` : ''}
  </div>`;
}
const json = (titulo, obj) => `<details class="json"><summary>{ } ${titulo}</summary><pre>${JSON.stringify(obj, null, 2)}</pre></details>`;

function webFrame(activo, body) {
  const items = ['Despachos','Nuevo despacho','Trazabilidad','Reportes','Transportadores','Rutas','Integración'];
  return `<div class="app"><div class="appbar"><div class="logo">LOGISTI<b>-X</b></div>
    <nav>${items.map(i => `<span class="${i===activo?'on':''}">${i}</span>`).join('')}</nav>
    <div class="user">Laura Gómez · COORDINADOR</div></div><div class="appbody">${body}</div></div>`;
}
function phoneFrame(titulo, sub, body) {
  return `<div class="phone-wrap"><div class="phone"><div class="pbar"><span>9:41</span><span>LOGISTI-X · Transportador</span></div>
    <div class="phead"><div class="muted" style="font-size:12px">${sub}</div><div class="t">${titulo}</div></div>
    <div class="pbody">${body}</div></div></div>`;
}

// ---------- estados genéricos
function carga(frame, tipo) {
  const filas = Array.from({length:6}, () => '<div class="skel" style="height:38px"></div>').join('');
  const body = `<div class="skel" style="height:28px;width:260px;margin-bottom:20px"></div>
    <div class="grid" style="gap:10px">${filas}</div>
    <p class="muted" style="margin-top:14px">Cargando… ${tipo}</p>`;
  return frame(body);
}
function vacio(frame, v) {
  return frame(`<div class="empty"><div class="ic">∅</div><h4>${v.t}</h4><p>${v.m}</p>${v.cta ? `<button class="btn pri">${v.cta}</button>` : ''}</div>`);
}
function error(frame, e) {
  return frame(`<div class="errbox"><div class="ic">!</div><h4>${e.t}</h4><div class="code">${e.code}</div><p>${e.m}</p>
    <div class="row" style="justify-content:center">${(e.ctas||['Reintentar']).map((c,i)=>`<button class="btn ${i===0?'pri':''}">${c}</button>`).join('')}</div></div>`);
}

// ---------- datos de ejemplo (formatos reales: DES-AAAA-NNNNNN, LGX-AAAA-NNNNNN-DV)
const despachos = [
  {n:'DES-2026-000131', g:'LGX-2026-000131-1', c:'Ferretería El Tornillo', ciu:'Envigado', e:'EN_RUTA', t:'Carlos Ruiz', kg:'38.400', f:'26/09/2026', i:1},
  {n:'DES-2026-000129', g:'LGX-2026-000129-1', c:'Distribuciones Aburrá SAS', ciu:'Medellín', e:'ASIGNADO', t:'Diana Mejía', kg:'112.000', f:'26/09/2026', i:0},
  {n:'DES-2026-000128', g:'LGX-2026-000128-1', c:'Clínica Dental Sonrisa', ciu:'Medellín', e:'FALLIDO', t:'Carlos Ruiz', kg:'4.200', f:'25/09/2026', i:2},
  {n:'DES-2026-000126', g:'—', c:'Papelería Central', ciu:'Itagüí', e:'EN_PREPARACION', t:'—', kg:'22.750', f:'—', i:0},
  {n:'DES-2026-000125', g:'—', c:'Tienda Doña Rosa', ciu:'Bello', e:'REGISTRADO', t:'—', kg:'9.600', f:'—', i:0},
  {n:'DES-2026-000117', g:'LGX-2026-000117-6', c:'Café La Loma', ciu:'Sabaneta', e:'ENTREGADO', t:'Diana Mejía', kg:'15.000', f:'24/09/2026', i:1},
];

// ============================================================================
// PANTALLAS
// ============================================================================
const S = {};

// ------------------------------------------------------------------ inicio
S.mapa = {
  grupo:'Guía', nombre:'Mapa del prototipo', cu:'—', frame:'none', sinEstados:true,
  normal(){ const filas = ORDEN.filter(k=>k!=='mapa').map(k=>{const s=S[k];return `<tr><td class="mono">${s.cu}</td><td><a href="#${k}" onclick="ir('${k}');return false">${s.nombre}</a></td><td>${esc(s.rf||'—')}</td><td class="mono">${s.api||'—'}</td></tr>`}).join('');
    return `<div class="app"><div class="appbody">
      <div class="h"><h2>Mockups de LOGISTI-X · cómo leer este prototipo</h2></div>
      <div class="grid g2">
        <div class="box"><h4>Qué es</h4><p style="margin:0">Prototipo navegable de fidelidad media: una pantalla por caso de uso del diagrama de casos de uso, con los mismos nombres de campo que los atributos del diagrama de clases. Arriba se cambia el <b>estado</b> de cada pantalla (normal, cargando, vacío, error) y se prenden o apagan las <b>anotaciones</b>.</p></div>
        <div class="box"><h4>Cómo se lee una anotación</h4><div class="legend">
          <span><i class="sw" style="border-color:var(--sales)"></i><b>← SALES-X</b>&nbsp;dato que llega del sistema de ventas</span>
          <span><i class="sw" style="border-color:var(--crm)"></i><b>← CRM-X</b>&nbsp;dato que llega del CRM</span>
          <span><i class="sw" style="border-color:var(--calc)"></i><b>calculado en servidor</b>&nbsp;no se escribe a mano (RN-11)</span>
          <span><i class="sw" style="border-color:var(--evt)"></i><b>evento →</b>&nbsp;la acción publica a otro sistema</span>
          <span><i class="sw" style="border-color:var(--out)"></i><b>→ SERVI-X</b>&nbsp;lo que se expone por REST</span>

        <tr><td class="mono">ANT-RIO</td><td>Oriente · Rionegro</td><td>Itagüí</td><td>Rionegro</td><td>Oriente</td><td class="num">2</td><td class="num">$ 22.000</td><td><span class="pill st-ENTREGADO">Activa</span></td></tr></tbody></table></div>

  vacio:{t:'No hay rutas',m:'Sin rutas no se puede calcular la fecha estimada ni el flete de un despacho.',cta:'+ Crear ruta'},
  error:{t:'Código de ruta repetido',code:'409 · codigo único',m:'Ya existe la ruta MED-CEN.',ctas:['Cambiar código']},

// ------------------------------------------------------------------ CU-19 + CU-20 integración
S.integracion = {
  grupo:'5 · Administración e integración', nombre:'Integración: bandeja y diagnóstico', cu:'CU-19, CU-20', rf:'RF-04, RNF-08', api:'POST /despachos/{id}/estado (SALES-X) · GET /integracion/diagnostico?pedidoId= · GET /integracion/eventos', dto:'CambiarEstado, OutboxEvento, DiagnosticoIntegracion.Informe',
  clases:'OutboxEvento, EstadoEvento, PuertoVentas, PuertoClientes', frame:'web', activo:'Integración',
  normal(){ return webFrame('Integración', `<div class="crumbs">Integración</div>
      <div class="h"><h2>Integración con INTEGRAX</h2><div class="act"><span class="pill st-ENTREGADO">SALES-X: REST</span><span class="pill st-FALLIDO">CRM-X: simulado</span></div></div>
      <div class="grid g2">
        <div class="box" style="padding:0" data-src="EVT"><div class="row" style="padding:14px 16px 0"><h4 style="margin:0">${P(1)} Bandeja de salida ${A('OutboxEvento')}</h4>${T.evt('SALES-X / FINAN-X')}</div><table class="t" style="margin-top:10px"><thead><tr><th>Evento ${A('tipo')}</th><th>Despacho</th><th>Estado ${A('estado : EstadoEvento')}</th><th class="num">Intentos ${A('intentos')}</th></tr></thead><tbody>
          <tr><td class="mono">despacho.entregado</td><td>DES-…131</td><td><span class="pill st-ENTREGADO">PUBLICADO</span></td><td class="num">1</td></tr>
          <tr><td class="mono">despacho.en-ruta</td><td>DES-…129</td><td><span class="pill st-FALLIDO">PENDIENTE</span></td><td class="num">2</td></tr>
          <tr><td class="mono">despacho.fallido</td><td>DES-…128</td><td><span class="pill st-CANCELADO">FALLIDO</span></td><td class="num">5</td></tr></tbody></table>
          <div style="padding:12px 16px" class="help">FALLIDO = agotó los reintentos; <span class="mono">ultimoError</span>: «SALES-X 503». Se puede reenviar a mano.</div></div>
        <div class="box" data-src="SALES-X"><h4>${P(2)} Cambios recibidos de SALES-X · CU-19 ${T.sales}</h4>
          <ul class="tl"><li><div class="when">25/09 10:12 · origen SALES-X</div><div class="what">PED-2026-0421 → despacho DES-2026-000130 CANCELADO</div><div class="muted">Motivo: «Cliente anuló la compra» · CambiarEstado.origen = SALES-X</div></li>
          <li class="nov"><div class="when">25/09 09:58 · origen SALES-X</div><div class="what">Rechazado: DES-2026-000117 ya estaba ENTREGADO</div><div class="muted">409 · RN-07 (un estado final no se mueve)</div></li></ul></div>
      </div><div class="spacer"></div>
      <div class="box"><h4>${P(3)} Diagnóstico de integración · CU-20</h4>
        <div class="row" style="margin-bottom:12px"><span class="filters" style="margin:0"><span class="in mono">pedidoId = a41f…</span></span><button class="btn">Diagnosticar</button></div>
        <div class="check"><i class="y">✓</i><b>SALES-X responde</b>&nbsp;<span class="muted">GET /pedidos/a41f… en 180 ms</span></div>
        <div class="check"><i class="y">✓</i><b>Pedido despachable</b>&nbsp;<span class="muted">estado APROBADO ∈ integrax.ventas.estados-despachables</span></div>
        <div class="check"><i class="w">!</i><b>Peso de productos</b>&nbsp;<span class="muted">1 línea sin pesoUnitarioKg: se usará el valor que digite el coordinador</span></div>
        <div class="check"><i class="n">✕</i><b>CRM-X</b>&nbsp;<span class="muted">sin URL configurada: se usa el doble ClientesSimulados</span></div>
        <div class="banner warn" style="margin:12px 0 0">Veredicto: <b>se puede integrar con avisos</b> (listoParaIntegrar = true). Falta pedirle a CRM-X su URL (docs/04-contratos-integracion.md).</div></div>`); },
  vacio:{t:'La bandeja está al día',m:'No hay eventos pendientes ni fallidos: SALES-X y FINAN-X recibieron todo.',cta:null},
  error:{t:'SALES-X lleva 5 intentos sin responder',code:'OutboxEvento.estado = FALLIDO · ultimoError: 503',m:'Los despachos siguen operando; los avisos esperan en la bandeja. Cuando SALES-X vuelva, reenvíe los fallidos.',ctas:['Reenviar fallidos','Ver diagnóstico']},
  pins:[['EVT','1. Salida asíncrona: OutboxEvento con reintentos (no saga): una entrega firmada no se deshace.'],['SALES-X','2. Entrada: SALES-X es actor principal de CU-19 y usa CambiarEstado.'],['—','3. CU-20 dice campo por campo qué le falta al JSON del otro equipo.']],
  notas:'Es la pantalla donde se ve la integración funcionando: lo que entra (CU-19), lo que sale (bandeja) y lo que falta (CU-20).'
};

const ORDEN = ['mapa','acceso','tablero','registrar','detalle','asignar','guia','ruta','entregar','novedad','reprogramar','devolver','trazabilidad','reportes','transportadores','rutas','integracion'];

// ============================================================================
// navegación y estados
// ============================================================================
let actual = 'mapa', estado = 'normal';
function frameDe(s){ return s.frame==='movil' ? (b)=>phoneFrame(s.nombre.replace('App: ',''),'LOGISTI-X',b) : (s.frame==='none' ? (b)=>`<div class="app"><div class="appbody">${b}</div></div>` : (b)=>webFrame(s.activo||'Despachos',`<div class="h"><h2>${s.nombre}</h2></div>${b}`)); }
const esc = (t) => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function render(){
  const s = S[actual];
  document.getElementById('ttl').textContent = `${s.cu} · ${s.nombre}`;
  let html;
  if (estado==='normal' || s.sinEstados) html = s.normal();
  else if (estado==='carga') html = carga(frameDe(s), s.nombre.toLowerCase());
  else if (estado==='vacio') html = s.vacio ? vacio(frameDe(s), s.vacio) : vacio(frameDe(s), {t:'Esta pantalla no tiene estado vacío',m:'Es una acción sobre un despacho que ya existe: siempre hay datos que mostrar. Revise el estado de error.'});
  else html = s.error ? error(frameDe(s), s.error) : s.normal();
  document.getElementById('screen').innerHTML = html;
  document.querySelectorAll('#estados button').forEach(b=>{ b.classList.toggle('on', b.dataset.e===estado); b.disabled = !!s.sinEstados && b.dataset.e!=='normal'; });
  document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on', a.dataset.k===actual));
  const pins = (s.pins||[]).map(([src,t],i)=>`<li><span class="pin" style="display:inline-grid">${i+1}</span><span>${esc(t)}</span></li>`).join('');
  document.getElementById('notes').innerHTML = `
    <div class="card"><h3>Trazabilidad de la pantalla</h3><dl>
      <dt>Caso de uso</dt><dd><b>${esc(s.cu)}</b></dd>
      <dt>Requisito</dt><dd>${esc(s.rf||'—')}</dd>
      <dt>Clases</dt><dd>${esc(s.clases||'—')}</dd>
      <dt>Servicio</dt><dd><code>${esc(s.api||'—')}</code></dd>
      <dt>Contrato</dt><dd><code>${esc(s.dto||'—')}</code></dd></dl></div>
    ${pins?`<div class="card"><h3>Puntos marcados</h3><ul class="pinlist">${pins}</ul></div>`:''}
    <div class="card"><h3>Nota de diseño</h3><p style="margin:0;font-size:13px">${s.notas||''}</p></div>
    <div class="card"><h3>Leyenda</h3><div class="legend">
      <span><i class="sw" style="border-color:var(--sales)"></i>← SALES-X (entra)</span>
      <span><i class="sw" style="border-color:var(--crm)"></i>← CRM-X (entra)</span>
      <span><i class="sw" style="border-color:var(--calc)"></i>calculado en servidor</span>
      <span><i class="sw" style="border-color:var(--evt)"></i>evento → otro sistema</span>
      <span><i class="sw" style="border-color:var(--out)"></i>→ SERVI-X por REST</span></div></div>`;
  if (location.hash.slice(1)!==actual) history.replaceState(null,'','#'+actual+(estado!=='normal'?'/'+estado:''));
}
function ir(k){ actual=k; estado='normal'; render(); document.querySelector('.stage').scrollTop=0; }
(function side(){
  let html = '<h1>LOGISTI-X · Mockups</h1><p class="sub">Prototipo navegable · INTEGRAX</p>'; let g='';
  ORDEN.forEach(k=>{ const s=S[k]; if (s.grupo!==g){ g=s.grupo; html+=`<div class="grp">${g}</div>`; } html+=`<a href="#${k}" data-k="${k}"><span class="cu">${s.cu.split(' ')[0]}</span><span>${s.nombre}</span></a>`; });
  const el=document.getElementById('side'); el.innerHTML=html;
  el.addEventListener('click',e=>{ const a=e.target.closest('a'); if(!a) return; e.preventDefault(); ir(a.dataset.k); });
})();
document.getElementById('estados').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; estado=b.dataset.e; render(); });
document.getElementById('ann').addEventListener('change',e=>document.body.classList.toggle('ann',e.target.checked));
(function desdeHash(){ const [k,e]=location.hash.slice(1).split('/'); if(S[k]) actual=k; if(['carga','vacio','error'].includes(e)) estado=e; })();
if (new URLSearchParams(location.search).has('captura')) document.body.classList.add('captura');
render();
</script>
